<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Vishal Consulting</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0b1120, #111827);
    padding: 20px;
  }

  .card {
    background: #111827;
    width: 100%;
    max-width: 380px;
    border-radius: 16px;
    padding: 32px 28px;
    border: 1px solid #22c55e;
    box-shadow: 0 10px 30px rgba(34,197,94,0.15);
  }

  .card h2 {
    text-align: center;
    margin-bottom: 6px;
    color: #22c55e;
  }

  .card p.sub {
    text-align: center;
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 22px;
  }

  .tabs {
    display: flex;
    background: #1f2937;
    border-radius: 8px;
    padding: 4px;
    margin-bottom: 20px;
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 9px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    color: #94a3b8;
    transition: .2s;
  }

  .tab.active {
    background: #22c55e;
    color: #000;
  }

  label {
    display: block;
    font-size: 13px;
    color: #cbd5e1;
    margin-bottom: 6px;
    margin-top: 14px;
  }

  input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #334155;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    background: #1f2937;
    color: #fff;
  }

  input:focus { border-color: #22c55e; }
  input::placeholder { color: #64748b; }

  .error-msg {
    color: #f87171;
    font-size: 12px;
    margin-top: 8px;
    min-height: 14px;
  }

  .success-msg {
    color: #22c55e;
    font-size: 13px;
    margin-top: 8px;
    min-height: 14px;
    font-weight: 600;
  }

  button.submit-btn {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #22c55e;
    color: #000;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: .3s;
  }

  button.submit-btn:hover { background: #16a34a; color: #fff; }
  button.submit-btn:disabled { opacity: .6; cursor: not-allowed; }

  .form-section { display: none; }
  .form-section.active { display: block; }
  .brand-header {
    text-align: center;
    margin-bottom: 24px;
  }
  .brand-header .logo-box {
    width: 90px;
    height: 90px;
    background: #fff;
    border-radius: 22px;
    box-shadow: 0 8px 20px rgba(0,0,0,.12);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
  }
  .brand-header .logo-box img {
    height: 56px;
    width: auto;
  }
  .brand-header h1 {
    font-size: 30px;
    font-weight: 800;
    background: linear-gradient(90deg, #22c55e, #16a34a);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: .3px;
    margin-bottom: 8px;
  }
  .brand-header .tagline {
    color: #94a3b8;
    font-size: 14px;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="brand-header">
      <div class="logo-box">
        <img src="logo.png" alt="Vishal Consulting Logo">
      </div>
      <h1>Vishal Consulting</h1>
      <p class="tagline">Join our team and start your financial journey</p>
    </div>
    <h2>Welcome</h2>
    <p class="sub">Login or create your Vishal Consulting account</p>

    <div class="tabs">
      <div class="tab active" id="loginTab">Login</div>
      <div class="tab" id="signupTab">Sign Up</div>
    </div>

    <!-- LOGIN FORM -->
    <div class="form-section active" id="loginSection">
      <form id="loginForm" novalidate>
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required>

        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" placeholder="Enter your password" required>

        <button type="submit" class="submit-btn" id="loginBtn">Login</button>
        <div class="error-msg" id="loginError"></div>
      </form>
    </div>

    <!-- SIGNUP FORM -->
    <div class="form-section" id="signupSection">
      <form id="signupForm" novalidate>
        <label for="signupName">Full Name</label>
        <input type="text" id="signupName" placeholder="Your full name" required>

        <label for="signupPhone">Phone Number</label>
        <input type="tel" id="signupPhone" placeholder="10-digit mobile number" required pattern="[0-9]{10}" maxlength="10">

        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" required>

        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" placeholder="At least 6 characters" required>

        <button type="submit" class="submit-btn" id="signupBtn">Create Account</button>
        <div class="error-msg" id="signupError"></div>
      </form>
    </div>

    <div class="success-msg" id="successMsg"></div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    updateProfile,
    setPersistence,
    browserSessionPersistence
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
  import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBG3XWczK9NHIAvz4xA9lc22qRV3iYoVd8",
    authDomain: "vishal-consulting-22aab.firebaseapp.com",
    projectId: "vishal-consulting-22aab",
    storageBucket: "vishal-consulting-22aab.firebasestorage.app",
    messagingSenderId: "347692393673",
    appId: "1:347692393673:web:2160e81d38c9b0df529918"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Session-only login: user must log in again every time they open the site fresh
  setPersistence(auth, browserSessionPersistence);

  // If already logged in (within this session), skip straight to home page
  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.location.href = "home.html";
    }
  });

  // Tab switching
  const loginTab = document.getElementById('loginTab');
  const signupTab = document.getElementById('signupTab');
  const loginSection = document.getElementById('loginSection');
  const signupSection = document.getElementById('signupSection');
  const successMsg = document.getElementById('successMsg');

  loginTab.addEventListener('click', () => {
    loginTab.classList.add('active');
    signupTab.classList.remove('active');
    loginSection.classList.add('active');
    signupSection.classList.remove('active');
    successMsg.textContent = '';
  });

  signupTab.addEventListener('click', () => {
    signupTab.classList.add('active');
    loginTab.classList.remove('active');
    signupSection.classList.add('active');
    loginSection.classList.remove('active');
    successMsg.textContent = '';
  });

  // Friendly error messages
  function friendlyError(code) {
    const map = {
      'auth/invalid-email': 'Sahi email address daalein.',
      'auth/user-not-found': 'Ye email registered nahi hai.',
      'auth/wrong-password': 'Password galat hai.',
      'auth/invalid-credential': 'Email ya password galat hai.',
      'auth/email-already-in-use': 'Ye email pehle se registered hai.',
      'auth/weak-password': 'Password kam se kam 6 characters ka hona chahiye.',
      'auth/missing-password': 'Password daalein.'
    };
    return map[code] || ('Error: ' + code);
  }

  // LOGIN
  const loginForm = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');

  loginForm.addEventListener('submit', (e) => {
    e.preventDefault();
    loginError.textContent = '';
    loginBtn.disabled = true;
    loginBtn.textContent = 'Logging in...';

    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value.trim();

    signInWithEmailAndPassword(auth, email, password)
      .then(() => {
        successMsg.textContent = '✅ Login successful! Redirecting...';
        setTimeout(() => window.location.href = 'home.html', 1000);
      })
      .catch((err) => {
        loginError.textContent = friendlyError(err.code);
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      });
  });

  // SIGNUP
  const signupForm = document.getElementById('signupForm');
  const signupBtn = document.getElementById('signupBtn');
  const signupError = document.getElementById('signupError');

  signupForm.addEventListener('submit', (e) => {
    e.preventDefault();
    signupError.textContent = '';
    signupBtn.disabled = true;
    signupBtn.textContent = 'Creating account...';

    const name = document.getElementById('signupName').value.trim();
    const phone = document.getElementById('signupPhone').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value.trim();

    createUserWithEmailAndPassword(auth, email, password)
      .then((result) => {
        const user = result.user;
        return updateProfile(user, { displayName: name })
          .then(() => setDoc(doc(db, 'users', user.uid), {
            name: name,
            phone: phone,
            email: email,
            createdAt: serverTimestamp()
          }));
      })
      .then(() => {
        successMsg.textContent = '✅ Account created! Redirecting...';
        setTimeout(() => window.location.href = 'home.html', 1000);
      })
      .catch((err) => {
        signupError.textContent = friendlyError(err.code);
        signupBtn.disabled = false;
        signupBtn.textContent = 'Create Account';
      });
  });
</script>

</body>
</html>
