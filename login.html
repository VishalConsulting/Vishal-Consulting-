 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Vishal Consulting</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0b1120, #111827);
    padding: 20px;
  }

  .card {
    background: #111827;
    width: 100%;
    max-width: 380px;
    border-radius: 16px;
    padding: 32px 28px;
    border: 1px solid #22c55e;
    box-shadow: 0 10px 30px rgba(34,197,94,0.15);
  }

  .card h2 {
    text-align: center;
    margin-bottom: 6px;
    color: #22c55e;
  }

  .card p.sub {
    text-align: center;
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 22px;
  }

  label {
    display: block;
    font-size: 13px;
    color: #cbd5e1;
    margin-bottom: 6px;
    margin-top: 14px;
  }

  input {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #334155;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
    background: #1f2937;
    color: #fff;
  }

  input:focus { border-color: #22c55e; }

  input::placeholder { color: #64748b; }

  .error-msg {
    color: #f87171;
    font-size: 12px;
    margin-top: 5px;
    min-height: 14px;
  }

  button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #22c55e;
    color: #000;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: .3s;
  }

  button:hover { background: #16a34a; color: #fff; }

  .switch {
    text-align: center;
    margin-top: 18px;
    font-size: 13px;
    color: #94a3b8;
  }

  .switch a {
    color: #22c55e;
    text-decoration: none;
    font-weight: 600;
  }

  .switch a:hover { text-decoration: underline; }

  .success-msg {
    display: none;
    text-align: center;
    color: #22c55e;
    font-size: 14px;
    margin-top: 16px;
    font-weight: 600;
  }
</style>
</head>
<body>

  <div class="card">
    <h2>Welcome Back</h2>
    <p class="sub">Login to your Vishal Consulting account</p>

    <form id="loginForm" novalidate>
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
      <div class="error-msg" id="emailError"></div>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>
      <div class="error-msg" id="passwordError"></div>

      <button type="submit">Login</button>
    </form>

    <div class="success-msg" id="successMsg">✅ Login successful! Redirecting...</div>

    <div class="switch">
      Don't have an account? <a href="#">Sign up</a><br><br>
      <a href="index.html">← Back to Home</a>
    </div>
  </div>

<script>
  const form = document.getElementById('loginForm');
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const emailError = document.getElementById('emailError');
  const passwordError = document.getElementById('passwordError');
  const successMsg = document.getElementById('successMsg');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    let valid = true;

    emailError.textContent = '';
    passwordError.textContent = '';

    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!email.value.trim()) {
      emailError.textContent = 'Email zaroori hai.';
      valid = false;
    } else if (!emailPattern.test(email.value.trim())) {
      emailError.textContent = 'Sahi email daalein.';
      valid = false;
    }

    if (!password.value.trim()) {
      passwordError.textContent = 'Password zaroori hai.';
      valid = false;
    } else if (password.value.trim().length < 6) {
      passwordError.textContent = 'Password kam se kam 6 characters ka ho.';
      valid = false;
    }

    if (valid) {
      form.style.display = 'none';
      successMsg.style.display = 'block';
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1500);
    }
  });
</script>

</body>
</html>
