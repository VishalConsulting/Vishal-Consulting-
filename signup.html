<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Vishal Consulting</title>

  <link rel="stylesheet" href="style.css">

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="auth.js"></script>
</head>
<body>

<div class="container">

  <div class="login-box">

    <h2>Create Account</h2>
    <p>Join Vishal Consulting</p>

    <form id="signupForm">

      <input
        type="email"
        id="email"
        placeholder="Enter Email"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Create Password"
        minlength="6"
        required
      >

      <button type="submit">
        Sign Up
      </button>

    </form>

    <br>

    <p>
      Already have an account?
      <a href="login.html">Login</a>
    </p>

    <div id="message"></div>

  </div>

</div>

</body>
</html>
