<!DOCTYPE html>
<html lang="en">
<head>
  <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBG3XWczK9NHIAvz4xA9lc22qRV3iYoVd8",
    authDomain: "vishal-consulting-22aab.firebaseapp.com",
    projectId: "vishal-consulting-22aab",
    storageBucket: "vishal-consulting-22aab.firebasestorage.app",
    messagingSenderId: "347692393673",
    appId: "1:347692393673:web:2160e81d38c9b0df529918"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  setPersistence(auth, browserSessionPersistence);

  document.documentElement.style.visibility = "hidden";

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "login.html";
    } else {
      document.documentElement.style.visibility = "visible";
    }
  });
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submit Report - Vishal Consulting</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: #0b1120; }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 5%;
    background: #fff;
    border-bottom: 1px solid #e2e8f0;
  }
  header .back-btn { color: #d97706; text-decoration: none; font-size: 20px; font-weight: 700; }
  header img.brand-logo { height: 30px; }
  header .brand-name { font-weight: 800; color: #0f172a; font-size: 17px; }

  .page-wrap { max-width: 460px; margin: 0 auto; padding: 20px 5% 40px; }

  .title-banner {
    background: linear-gradient(135deg, #f59e0b, #eab308);
    border-radius: 20px;
    padding: 24px 22px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }
  .title-banner .back-circle {
    width: 40px; height: 40px;
    background: rgba(0,0,0,.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #0f172a;
    text-decoration: none;
    font-size: 18px;
    flex-shrink: 0;
  }
  .title-banner h1 { color: #0f172a; font-size: 24px; margin-bottom: 4px; }
  .title-banner p { color: #78350f; font-size: 13.5px; }

  .report-card {
    border-radius: 20px;
    padding: 30px 24px;
    text-align: center;
    margin-bottom: 18px;
  }
  .report-card.green { background: linear-gradient(160deg, #ecfdf5, #d1fae5); }
  .report-card.blue { background: linear-gradient(160deg, #eff6ff, #dbeafe); }

  .report-icon-circle {
    width: 74px; height: 74px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    margin: 0 auto 18px;
  }
  .green .report-icon-circle { background: #a7f3d0; color: #059669; }
  .blue .report-icon-circle { background: #bfdbfe; color: #2563eb; }

  .report-card h2 { color: #0f172a; font-size: 22px; margin-bottom: 8px; }
  .report-card p { color: #64748b; font-size: 14px; margin-bottom: 22px; }

  .select-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 12px;
    color: #fff;
    font-weight: 700;
    font-size: 16px;
    text-decoration: none;
  }
  .green .select-btn { background: #059669; }
  .blue .select-btn { background: #2563eb; }
</style>
</head>
<body>

  <header>
    <a href="home.html" class="back-btn">←</a>
    <img src="logo.png" alt="Vishal Consulting Logo" class="brand-logo">
    <span class="brand-name">Vishal Consulting</span>
  </header>

  <div class="page-wrap">

    <div class="title-banner">
      <a href="home.html" class="back-circle">←</a>
      <div>
        <h1>Submit Report</h1>
        <p>Choose the type of report you want to submit</p>
      </div>
    </div>

    <div class="report-card green">
      <div class="report-icon-circle">👤➕</div>
      <h2>Account Open Report</h2>
      <p>Submit details for successfully opened accounts</p>
      <a href="account-open-report.html" class="select-btn">Select →</a>
    </div>

    <div class="report-card blue">
      <div class="report-icon-circle">📈</div>
      <h2>Trade Report</h2>
      <p>Submit details for completed trades</p>
      <a href="trade-report.html" class="select-btn">Select →</a>
    </div>

  </div>

</body>
</html>
